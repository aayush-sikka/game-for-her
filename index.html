const NAME="Pidu";   // made-for name
const GREET="Pavani";

const WIN=5, FWIN=10;

const c=document.getElementById('c'),x=c.getContext('2d'),W=480,H=760,R=34,PW=120,PH=16,PY=H-46,AY=30,GY=H-80;
const F=s=>'bold '+s+'px "Arial Rounded MT Bold","Trebuchet MS",sans-serif';
let img=null;if(FACE){img=new Image();img.src=FACE}
let mode='intro',player,ai,ball,sc,state='ready',keys={},msg='',bits=[],squash=0,t=0,overAt=0;
let bird,pipes,fsc,fs='ready',fmsg='',scroll=0,flash=0,lastG=H/2;
const BX=130,HR=20,GAP=215,PWD=76;

function fit(){const w=document.getElementById('wrap'),s=Math.min((w.clientWidth-16)/W,(w.clientHeight-16)/H);c.style.width=W*s+'px';c.style.height=H*s+'px'}
addEventListener('resize',fit);addEventListener('orientationchange',fit);fit();

let ac=null;
function tone(f1,f2,d,ty,v,dl){
  if(!ac)return;const s=ac.currentTime+(dl||0),o=ac.createOscillator(),g=ac.createGain();
  o.type=ty||'sine';o.frequency.setValueAtTime(f1,s);o.frequency.exponentialRampToValueAtTime(f2,s+d);
  g.gain.setValueAtTime(v||.25,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(ac.destination);o.start(s);o.stop(s+d);
}
function boing(){const b=300+Math.random()*250;tone(b,b*2.4,.12,'square',.18);tone(b*2.4,b*.8,.22,'sine',.25,.1)}
function wah(){[330,300,270,200].forEach((f,i)=>tone(f,f*.85,.28,'sawtooth',.15,i*.28))}
function cheer(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,f,.18,'triangle',.25,i*.1))}
function confetti(){
  const cl=['#ff7a59','#7fd1ae','#ffd08a','#f6a6ff','#8ecbff','#fff4d6'];
  for(let i=0;i<160;i++)bits.push({x:W/2+(Math.random()-.5)*80,y:H/2,vx:(Math.random()-.5)*14,vy:-Math.random()*14-3,s:5+Math.random()*7,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cl[i%6]});
}

// ---- Pong ----
function resetP(){player={x:W/2};ai={x:W/2};sc=[0,0];state='ready';serve(1,false)}
function serve(d,fast){
  if(fast)ball={x:80+Math.random()*(W-160),y:AY+R+10,vx:Math.random()*4-2,vy:8.5,a:0};
  else ball={x:W/2,y:H/2,vx:Math.random()*4-2,vy:5*d,a:0};
}
function ptap(){if(state==='ready')state='play';else if(state==='over'&&Date.now()-overAt>500){resetP();state='play'}}
function stepP(){
  if(state!=='play')return;
  if(keys.arrowleft||keys.a)player.x-=8;if(keys.arrowright||keys.d)player.x+=8;
  player.x=Math.max(PW/2,Math.min(W-PW/2,player.x));
  const sp=2.6+Math.min(sc[0],4)*.15,tx=ball.vy<0?ball.x:W/2;
  ai.x+=Math.max(-sp,Math.min(sp,tx-ai.x));ai.x=Math.max(PW/2,Math.min(W-PW/2,ai.x));
  ball.x+=ball.vx;ball.y+=ball.vy;ball.a+=ball.vy*.03;
  if(ball.x<R||ball.x>W-R){ball.vx*=-1;ball.x=Math.max(R,Math.min(W-R,ball.x))}
  hit(player,PY,1);hit(ai,AY,-1);
  if(ball.y<-R){sc[0]++;chk(-1,true)}
  if(ball.y>H+R){sc[1]++;chk(1,false)}
}
function hit(p,py,d){
  if(ball.vy*d>0&&Math.abs(ball.y-py)<R+PH&&Math.abs(ball.x-p.x)<PW/2+R*.6){
    ball.vy=-d*Math.min(11,Math.abs(ball.vy)*1.05);ball.vx=(ball.x-p.x)/(PW/2)*6;ball.y=py-d*(R+PH);squash=1;boing();
  }}
function chk(d,won){
  if(sc[0]>=WIN){state='over';overAt=Date.now();msg='You win!';confetti();cheer();setTimeout(confetti,500)}
  else if(sc[1]>=WIN){state='over';overAt=Date.now();msg='Ha, I got you!';wah()}
  else if(won){confetti();cheer();serve(-1,false)}else{wah();serve(1,true)}
}

// ---- Flappy (rebuilt) ----
function resetF(){bird={y:H/2-20,vy:0};pipes=[];fsc=0;fs='ready';lastG=H/2;flash=0}
function flap(){
  if(fs==='over'){if(Date.now()-overAt<500)return;resetF()}
  fs='play';bird.vy=-7.4;squash=1;tone(420,880,.1,'square',.12);
}
function die(m){fs='over';overAt=Date.now();fmsg=m;flash=1;wah()}
function stepF(){
  flash=Math.max(0,flash-.06);
  if(fs==='ready'){bird.y=H/2-20+Math.sin(t/14)*10;scroll+=2;return}
  if(fs==='over'){if(bird.y<GY-HR){bird.vy+=.5;bird.y=Math.min(GY-HR,bird.y+bird.vy)}return}
  scroll+=3;bird.vy=Math.min(bird.vy+.45,10);bird.y+=bird.vy;
  if(bird.y<HR){bird.y=HR;bird.vy=0}
  for(const p of pipes)p.x-=3;
  if(!pipes.length||pipes[pipes.length-1].x<W-250){
    const lo=GAP/2+90,hi=GY-GAP/2-90;
    lastG=Math.max(lo,Math.min(hi,lastG+(Math.random()-.5)*340));
    pipes.push({x:W+PWD,g:lastG,s:false});
  }
  pipes=pipes.filter(p=>p.x>-PWD);
  for(const p of pipes){
    if(BX+HR>p.x-PWD/2&&BX-HR<p.x+PWD/2&&(bird.y-HR<p.g-GAP/2||bird.y+HR>p.g+GAP/2))return die('Oops!');
    if(!p.s&&p.x<BX-HR){
      p.s=true;fsc++;tone(660,1100,.1,'triangle',.2);
      if(fsc>=FWIN){fs='over';overAt=Date.now();fmsg='You win!';confetti();cheer();setTimeout(confetti,500)}
      else if(fsc%5===0){confetti();cheer()}
    }
  }
  if(bird.y>=GY-HR){bird.y=GY-HR;die('Oops!')}
}

// ---- Input ----
function startPong(){mode='pong';resetP();squash=0}
function startFlappy(){mode='flappy';resetF();squash=0}
function pt(e){const r=c.getBoundingClientRect(),q=e.touches?e.touches[0]:e;return{x:(q.clientX-r.left)/r.width*W,y:(q.clientY-r.top)/r.height*H}}
function down(e){
  if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(err){}}
  if(ac&&ac.state==='suspended')ac.resume();
  const p=pt(e);
  if(mode==='intro'){mode='menu';return}
  if(mode!=='menu'&&p.x>W-92&&p.y<50){mode='menu';bits=[];return}
  if(mode==='menu'){if(p.x>50&&p.x<430){if(p.y>290&&p.y<440)startPong();else if(p.y>465&&p.y<615)startFlappy()}}
  else if(mode==='pong'){player.x=p.x;ptap()}else flap();
}
c.addEventListener('touchstart',e=>{e.preventDefault();down(e)},{passive:false});
c.addEventListener('touchmove',e=>{e.preventDefault();if(mode==='pong')player.x=pt(e).x},{passive:false});
c.addEventListener('mousemove',e=>{if(mode==='pong')player.x=pt(e).x});
c.addEventListener('mousedown',down);
addEventListener('keydown',e=>{
  keys[e.key.toLowerCase()]=1;if(e.key.startsWith('Arrow')||e.key===' ')e.preventDefault();
  if(e.key===' '||e.key==='ArrowUp'){if(mode==='pong')ptap();else if(mode==='flappy')flap()}
});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);

function step(){
  t++;for(const b of bits){b.x+=b.vx;b.y+=b.vy;b.vy+=.3;b.vx*=.99;b.r+=b.vr}
  bits=bits.filter(b=>b.y<H+20);if(squash>0)squash-=.08;
  if(mode==='pong')stepP();else if(mode==='flappy')stepF();
}

// ---- Drawing ----
function txt(s,y,size,col){x.fillStyle=col||'#fff4d6';x.font=F(size);x.textAlign='center';x.fillText(s,W/2,y)}
function wrap(s,y,size,max,col){
  x.fillStyle=col;x.font=F(size);x.textAlign='center';let l='';
  for(const k of s.split(' ')){if(x.measureText(l+k).width>max){x.fillText(l.trim(),W/2,y);y+=size*1.35;l=''}l+=k+' '}
  x.fillText(l.trim(),W/2,y);return y+size*1.35;
}
function rr(a,b,w,h,r,f){x.fillStyle=f;x.beginPath();x.roundRect(a,b,w,h,r);x.fill()}
function face(r){
  if(img&&img.complete&&img.width){
    x.save();x.beginPath();x.arc(0,0,r,0,7);x.clip();const s=Math.min(img.width,img.height);
    x.drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,-r,-r,r*2,r*2);x.restore();
    x.lineWidth=3;x.strokeStyle='#fff';x.beginPath();x.arc(0,0,r,0,7);x.stroke();
  }else{
    const k=r/34;x.fillStyle='#ffd08a';x.beginPath();x.arc(0,0,r,0,7);x.fill();x.strokeStyle='#1d2b3a';x.lineWidth=3;x.stroke();
    x.fillStyle='#1d2b3a';x.beginPath();x.arc(-12*k,-8*k,4.5*k,0,7);x.arc(12*k,-8*k,4.5*k,0,7);x.fill();
    x.beginPath();x.arc(0,5*k,14*k,.15*Math.PI,.85*Math.PI);x.stroke();
  }
}
function bg(a,b){const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,a);g.addColorStop(1,b);x.fillStyle=g;x.fillRect(0,0,W,H)}
function card(y,h){rr(50,y,380,h,24,'rgba(20,30,50,.82)')}
function pill(s,y,col){rr(W/2-110,y,220,48,24,col||'#ff7a59');txt(s,y+32,22,'#1d2b3a')}

    else{x.fillStyle='#2f6b3a';x.fillRect(-12,-53,24,42);x.fillRect(-12,22,24,31);face(18)}
    x.restore();
    x.textAlign='left';x.fillStyle='#1d2b3a';x.font=F(32);x.fillText(b[1],200,b[0]+72);
    x.font=F(16);x.fillStyle='#4a5a6a';x.fillText(b[2],200,b[0]+102);
  });
  txt('Tap a card to play',680,18,'rgba(255,244,214,.85)');
}
function drawP(){
  bg('#1d2b3a','#27405a');
  x.setLineDash([12,14]);x.strokeStyle='rgba(255,244,214,.3)';x.lineWidth=3;x.beginPath();x.moveTo(0,H/2);x.lineTo(W,H/2);x.stroke();x.setLineDash([]);
  x.textAlign='left';x.fillStyle='rgba(255,244,214,.85)';x.font=F(56);x.fillText(sc[1],20,H/2-18);x.fillText(sc[0],20,H/2+58);
  rr(ai.x-PW/2,AY-PH/2,PW,PH,8,'#ff7a59');rr(player.x-PW/2,PY-PH/2,PW,PH,8,'#7fd1ae');
  x.textAlign='center';x.font=F(14);x.fillStyle='rgba(255,244,214,.7)';x.fillText('Me',ai.x,AY+30);x.fillText('You',player.x,PY-18);
  x.save();x.translate(ball.x,ball.y);x.rotate(ball.a);const q=Math.max(0,squash);x.scale(1+q*.25,1-q*.25);face(R);x.restore();
  if(state==='ready'){x.fillStyle='rgba(0,0,0,.55)';x.fillRect(0,0,W,H);card(H/2-120,240);
    txt('Person Pong',H/2-60,40);txt('Made for '+(NAME||'you'),H/2-25,22,'#ffd08a');txt('Drag to move your paddle',H/2+15,18);pill('Tap to start',H/2+45)}
  else if(state==='over'){x.fillStyle='rgba(0,0,0,.55)';x.fillRect(0,0,W,H);card(H/2-140,290);
    txt(msg,H/2-80,44);if(sc[0]>=WIN)wrap(MESSAGE,H/2-35,20,330,'#ffd08a');pill('Play again',H/2+70)}
}
function cloud(cx,cy,s){x.beginPath();x.arc(cx,cy,22*s,0,7);x.arc(cx+24*s,cy-10*s,28*s,0,7);x.arc(cx+52*s,cy,22*s,0,7);x.fill()}
function drawF(){
  bg('#7ec8f0','#ffe3c0');
  x.fillStyle='rgba(255,255,255,.75)';
  [[40,130,1],[300,230,1.3],[180,420,.8]].forEach((k,i)=>{const px=((k[0]-scroll*(.2+i*.1))%(W+160)+W+160)%(W+160)-80;cloud(px,k[1],k[2])});
  for(const p of pipes){
    const tp=p.g-GAP/2,bt=p.g+GAP/2;
    [[0,tp,tp-26],[bt,GY-bt,bt]].forEach(r=>{
      x.fillStyle='#5fb96a';x.fillRect(p.x-PWD/2+4,r[0],PWD-8,r[1]);x.fillStyle='#8fdc8a';x.fillRect(p.x-PWD/2+10,r[0],10,r[1]);
      x.strokeStyle='#2f6b3a';x.lineWidth=3;x.strokeRect(p.x-PWD/2+4,r[0],PWD-8,r[1]);
      x.fillStyle='#5fb96a';x.fillRect(p.x-PWD/2-4,r[2],PWD+8,26);x.strokeRect(p.x-PWD/2-4,r[2],PWD+8,26);
    });
  }
  x.fillStyle='#e8cf8c';x.fillRect(0,GY,W,H-GY);x.fillStyle='#5fb96a';x.fillRect(0,GY,W,14);
  x.fillStyle='#d4b86e';for(let i=-1;i<14;i++)x.fillRect(i*40-scroll%40,GY+30,20,8);
  x.strokeStyle='#2f6b3a';x.lineWidth=3;x.beginPath();x.moveTo(0,GY);x.lineTo(W,GY);x.stroke();
  x.save();x.translate(BX,bird.y);x.rotate(Math.max(-.45,Math.min(1.1,bird.vy*.07)));
  const fl=fs==='over'?0:Math.sin(t*.6)*.5,q=Math.max(0,squash);
  x.fillStyle='#fff';x.strokeStyle='#1d2b3a';x.lineWidth=2;x.save();x.translate(-22,6);x.rotate(fl);x.beginPath();x.ellipse(0,0,16,9,0,0,7);x.fill();x.stroke();x.restore();
  x.scale(1-q*.1,1+q*.15);face(28);x.restore();
  if(fs==='play'){x.font=F(70);x.textAlign='center';x.lineWidth=8;x.strokeStyle='#1d2b3a';x.strokeText(fsc,W/2,110);x.fillStyle='#fff';x.fillText(fsc,W/2,110)}
  if(fs==='ready'){card(200,230);txt('Flappy Face',255,38);txt('Made for '+(NAME||'you'),290,22,'#ffd08a');txt('Tap to flap through the gaps',325,17);pill('Tap to start',345,'#7fd1ae')}
  if(flash>0){x.fillStyle='rgba(255,255,255,'+flash*.8+')';x.fillRect(0,0,W,H)}
  if(fs==='over'){x.fillStyle='rgba(0,0,0,.4)';x.fillRect(0,0,W,H);card(210,300);
    txt(fmsg,270,44);txt('Score '+fsc,310,24);if(fsc>=FWIN)wrap(FMESSAGE,350,19,330,'#ffd08a');pill('Try again',420)}
}
function draw(){
  if(mode==='intro')drawIntro();else if(mode==='menu')drawMenu();else if(mode==='pong')drawP();else drawF();
  for(const b of bits){x.save();x.translate(b.x,b.y);x.rotate(b.r);x.fillStyle=b.c;x.fillRect(-b.s/2,-b.s/4,b.s,b.s/2);x.restore()}
  if(mode!=='menu'&&mode!=='intro'){rr(W-90,10,78,32,16,'rgba(255,244,214,.92)');txt('Menu',32,16,'#1d2b3a')}
}
// fixed 60 steps/second so speed is the same on 60Hz and 120Hz phones
let last=0,acc=0;
function loop(ts){const d=Math.min(100,ts-last);last=ts;acc+=d;while(acc>=16.667){step();acc-=16.667}draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
